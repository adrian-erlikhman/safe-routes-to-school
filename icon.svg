<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Paper ground, a shortest path in ink, and the calmer route in green
       stepping around it. Same three colours as the app. -->
  <rect width="64" height="64" rx="10" fill="#e8e4d6"/>
  <path d="M14 50 L50 14" stroke="#211f18" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6" fill="none"/>
  <path d="M14 50 L14 30 L34 30 L34 14 L50 14" stroke="#3c7a4e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="9" y="45" width="10" height="10" fill="#211f18" stroke="#e8e4d6" stroke-width="2"/>
  <rect x="45" y="9" width="10" height="10" fill="#3c7a4e" stroke="#e8e4d6" stroke-width="2"/>
</svg>
